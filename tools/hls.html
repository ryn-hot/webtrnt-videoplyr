<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MKV Demuxer – HLS Test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; background: #111; color: #e6e6e6; }
    h1 { font-size: 1.4rem; margin-bottom: 0.75rem; }
    video { width: min(100%, 960px); background: #000; border: 1px solid #333; border-radius: 6px; }
    .controls { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
    label { display: flex; gap: 0.5rem; align-items: center; }
    select, input[type="text"] { padding: 0.35rem 0.5rem; border-radius: 4px; border: 1px solid #444; background: #1e1e1e; color: inherit; }
    button { padding: 0.4rem 0.8rem; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: inherit; cursor: pointer; }
    button:hover { background: #333; }
    pre { max-width: min(100%, 960px); background: #1a1a1a; padding: 0.75rem; border-radius: 6px; border: 1px solid #333; overflow: auto; max-height: 320px; }
    a { color: #7fb4ff; }
    .debug-panel { margin-top: 1rem; max-width: min(100%, 960px); background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 0.75rem; }
    .debug-panel h2 { margin-top: 0; font-size: 1.1rem; }
    .debug-grid { display: flex; flex-wrap: wrap; gap: 1rem; font-family: monospace; }
    .debug-grid div { min-width: 180px; }
  </style>
</head>
<body>
  <h1>MKV Demuxer – HLS Test</h1>
  <p>This page loads <code>/hls/master.m3u8</code> via hls.js so you can confirm live playback and audio track switching. Update the source URL if you run the streamer on a different port/host.</p>

  <video id="player" controls autoplay muted playsinline></video>

  <div class="controls">
    <label>
      Manifest URL
      <input id="manifest" type="text" size="60" value="http://localhost:8081/hls/master.m3u8" />
    </label>
    <button id="reload">Reload</button>
    <label>
      Audio Track
      <select id="audioTracks"></select>
    </label>
  </div>

  <div class="debug-panel">
    <h2>Frontend Debug</h2>
    <div class="debug-grid" id="debugState">
      <div>time: –</div>
      <div>duration: –</div>
      <div>buffered: –</div>
      <div>state: –</div>
    </div>
    <div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
      <button id="downloadFrontendLog">Download Frontend Log</button>
    </div>
  </div>

  <pre id="log"></pre>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <script>
    const logEl = document.getElementById('log');
    const video = document.getElementById('player');
    const manifestInput = document.getElementById('manifest');
    const reloadBtn = document.getElementById('reload');
    const audioSelect = document.getElementById('audioTracks');
    const debugStateEl = document.getElementById('debugState');
    const downloadFrontendBtn = document.getElementById('downloadFrontendLog');

    const initialSrc = new URLSearchParams(window.location.search).get('src');
    if (initialSrc) manifestInput.value = initialSrc;

    const frontendLog = [];
    function log(msg) {
      const time = new Date().toISOString().split('T')[1].replace('Z', '');
      logEl.textContent = `[${time}] ${msg}\n` + logEl.textContent;
      frontendLog.push(`[${time}] ${msg}`);
      if (frontendLog.length > 5000) frontendLog.shift();
      window.__frontendLog = frontendLog;
    }

    let hls = null;

    const probeLog = [];
    const probeLimit = 5000;

    function recordProbe(type, detail) {
      const entry = {
        ts: performance.now(),
        type,
        detail
      };
      probeLog.push(entry);
      if (probeLog.length > probeLimit) probeLog.shift();
    }

    function downloadProbe() {
      const blob = new Blob([JSON.stringify({ entries: probeLog }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `probe-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    const downloadBtn = document.createElement('button');
    downloadBtn.textContent = 'Download Probe Log';
    downloadBtn.addEventListener('click', downloadProbe);
    document.querySelector('.controls').appendChild(downloadBtn);

    function downloadFrontendLog() {
      const blob = new Blob([frontendLog.join('\n') || 'No entries yet.'], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `frontend-log-${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }
    downloadFrontendBtn.addEventListener('click', downloadFrontendLog);

    function teardown() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      audioSelect.innerHTML = '';
      delete video.__tryStartPlayback;
    }

    function populateAudioTracks(tracks, selected) {
      audioSelect.innerHTML = '';
      tracks.forEach((track, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${track.name || 'Track'} (${track.lang || 'und'})${track.default ? ' • default' : ''}`;
        if (idx === selected) opt.selected = true;
        audioSelect.appendChild(opt);
      });
      audioSelect.disabled = tracks.length <= 1;
    }

  function loadStream(src) {
    teardown();
    if (Hls.isSupported()) {
      const hlsConfig = {
        enableWorker: true,
          lowLatencyMode: false,
          startPosition: 0,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          backBufferLength: 30,
          maxBufferSize: 60 * 1024 * 1024
        };
        hls = new Hls(hlsConfig);
        hls.loadSource(src);
        hls.attachMedia(video);

        let initialPlayQueued = false;
        let initialSeekDone = false;

        const tryStartPlayback = (reason) => {
          if (initialPlayQueued) return;
          if (!video.buffered || video.buffered.length === 0) return;
          const start = video.buffered.start(0);
          const end = video.buffered.end(video.buffered.length - 1);
          if (!Number.isFinite(start) || !Number.isFinite(end)) return;
          if (end - start < 0.5) {
            log(`Deferred autoplay (${reason}) buffered=${(end - start).toFixed(3)}s`);
            return;
          }
          if (!initialSeekDone && Math.abs(video.currentTime - start) > 0.01) {
            video.currentTime = start;
          }
          video.play().then(() => {
            initialPlayQueued = true;
            log(`Autoplay succeeded (${reason})`);
          }).catch(err => {
            log(`play() failed after ${reason}: ${err.message || err}`);
          });
        };
        video.__tryStartPlayback = tryStartPlayback;

        hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
          log(`Manifest parsed: ${data.levels.length} variant(s)`);
          hls.startLoad(0);
          video.currentTime = 0;
        });

        hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, (_, data) => {
          log(`Audio tracks: ${data.audioTracks.length}`);
          populateAudioTracks(data.audioTracks, hls.audioTrack);
          recordProbe('audio-tracks-updated', data);
        });

        hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, (_, data) => {
          log(`Switched audio track → #${data.id}`);
          audioSelect.value = String(data.id);
          recordProbe('audio-track-switched', data);
        });

        hls.on(Hls.Events.FRAG_BUFFERED, (_, data) => {
          if (!initialSeekDone) {
            const start = Math.max(0, data?.frag?.start ?? 0);
            if (Math.abs(video.currentTime - start) > 0.01) {
              video.currentTime = start;
            }
            initialSeekDone = true;
          }
          tryStartPlayback('buffered');
        });

        hls.on(Hls.Events.ERROR, (_, data) => {
          log(`ERROR [${data.type}] ${data.details || ''} (fatal=${data.fatal})`);
          if (data?.error) {
            const { name, message, code, stack } = data.error;
            log(`  error=${name || 'Error'} code=${code ?? ''} msg=${message || ''}`);
            if (stack) {
              stack.split('\n').forEach(line => line && log(`    ${line}`));
            }
          }
          recordProbe('hls-error', data);
          if (data.details === Hls.ErrorDetails.BUFFER_FULL_ERROR) {
            const seekTarget = Math.max(0, video.currentTime - 2);
            log(`Buffer full, trimming backbuffer and seeking to ${seekTarget.toFixed(2)}s`);
            if (!video.paused) video.pause();
            video.currentTime = seekTarget;
            video.play().catch(err => log(`  resume failed: ${err.message || err}`));
          }
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                log('Fatal network error encountered, trying to recover…');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                log('Fatal media error encountered, trying to recover…');
                hls.recoverMediaError();
                break;
              default:
                log('Unrecoverable error, destroying hls.js');
                teardown();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        log('Using native HLS playback (Safari/iOS).');
      } else {
        log('Neither hls.js nor native HLS is available in this browser.');
      }
    }

    reloadBtn.addEventListener('click', () => {
      const url = manifestInput.value.trim();
      if (url) loadStream(url);
    });

    audioSelect.addEventListener('change', () => {
      if (hls && audioSelect.value !== '') {
        hls.audioTrack = Number(audioSelect.value);
      }
    });

    video.addEventListener('error', () => {
      const err = video.error;
      if (!err) return;
      log(`VIDEO TAG ERROR code=${err.code} msg=${err.message || ''}`);
    });

    function getBufferedRanges() {
      if (!video.buffered) return [];
      return [...Array(video.buffered.length)].map(i => ({ start: video.buffered.start(i), end: video.buffered.end(i) }));
    }

    function isTimeBuffered(timeSec) {
      if (!Number.isFinite(timeSec)) return false;
      const ranges = getBufferedRanges();
      const epsilon = 0.01;
      return ranges.some(r => timeSec >= (r.start - epsilon) && timeSec <= (r.end + epsilon));
    }

    const notifySeekReset = (reason, opts = {}) => {
      const ct = Number.isFinite(video.currentTime) ? video.currentTime : undefined;
      const url = manifestInput.value?.trim?.() || '';
      const base = url.startsWith('http') ? new URL(url).origin : 'http://localhost:8081';
      const params = new URLSearchParams();
      params.set('reason', reason);
      if (ct != null) params.set('time', ct.toString());
      if (opts.outOfBuffer) params.set('outOfBuffer', '1');
      fetch(`${base}/control/seek-reset?${params.toString()}`)
        .then(() => log(`Notified server of ${reason} reset at t=${ct?.toFixed?.(2) ?? 'n/a'}s via ${base}${opts.outOfBuffer ? ' (out-of-buffer)' : ''}`))
        .catch(err => log(`Failed to notify seek reset at ${base}: ${err?.message || err}`));
    };

    ['play','pause','seeking','seeked','waiting','stalled','ended'].forEach(evt => {
      video.addEventListener(evt, () => {
        const detail = { currentTime: video.currentTime, readyState: video.readyState };
        log(`video event: ${evt} t=${video.currentTime.toFixed(2)} readyState=${video.readyState}`);
        recordProbe(`video-${evt}`, detail);
        if (evt === 'seeked') {
          const tryStart = video.__tryStartPlayback;
          if (typeof tryStart === 'function') tryStart('seeked');
        }
        if (evt === 'seeking') {
          const outOfBuffer = !isTimeBuffered(video.currentTime);
          notifySeekReset('player-seeking', { outOfBuffer });
        }
      });
    });

    video.addEventListener('timeupdate', () => {
      if (!Number.isFinite(video.currentTime)) return;
      const ranges = getBufferedRanges();
      log(`video timeupdate t=${video.currentTime.toFixed(3)} buffered=${ranges.map(r => `${r.start.toFixed(3)}-${r.end.toFixed(3)}`).join(' | ')}`);
      recordProbe('timeupdate', { currentTime: video.currentTime, buffered: ranges });
    });

    function updateDebugState() {
      if (!debugStateEl) return;
      const ranges = getBufferedRanges();
      const bufferedStr = ranges.length ? `${ranges[0].start.toFixed(2)}-${ranges[ranges.length - 1].end.toFixed(2)}` : '–';
      const entries = [
        `time: ${Number.isFinite(video.currentTime) ? video.currentTime.toFixed(2) : '–'}`,
        `duration: ${Number.isFinite(video.duration) ? video.duration.toFixed(2) : '–'}`,
        `buffered: ${bufferedStr}`,
        `readyState: ${video.readyState}`
      ];
      debugStateEl.innerHTML = entries.map(text => `<div>${text}</div>`).join('');
      recordProbe('debug-state', {
        time: video.currentTime,
        duration: video.duration,
        buffered: ranges,
        readyState: video.readyState,
        paused: video.paused
      });
    }
    setInterval(updateDebugState, 1000);

    if (manifestInput.value) {
      loadStream(manifestInput.value.trim());
    }

    window.addEventListener('beforeunload', teardown);
    window.addEventListener('error', (evt) => {
      const err = evt.error;
      log(`WINDOW ERROR: ${evt.message || err?.message || ''}`);
      if (err?.stack) err.stack.split('\n').forEach(line => line && log(`    ${line}`));
    });
    window.addEventListener('unhandledrejection', (evt) => {
      const reason = evt.reason;
      log(`UNHANDLED REJECTION: ${reason && reason.message ? reason.message : reason}`);
      if (reason?.stack) reason.stack.split('\n').forEach(line => line && log(`    ${line}`));
    });
  </script>
</body>
</html>
